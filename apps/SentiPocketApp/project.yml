# XcodeGen manifest — Atlas owns this + the generated project. Reproducible from these Windows-authored
# sources: on a Mac run `xcodegen generate` (brew install xcodegen) then open SentiPocketApp.xcodeproj.
# Keeps the Xcode project OUT of git-conflict territory (only this yaml + Swift sources are tracked).
name: SentiPocketApp
options:
  bundleIdPrefix: com.plexaura.sentipocket
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  PocketContracts:
    path: ../../packages/PocketContracts
  PocketCall:
    path: ../../packages/PocketCall
  PocketUI:
    path: ../../packages/PocketUI
  PocketReasoning:
    path: ../../packages/PocketReasoning
  # PocketDialVoice RE-ADDED to the app target 2026-07-25 (Atlas, per Forge #319232/PR #81): on-device Whisper STT
  # ACTUALLY SHIPS now (LiveDialVoice: speak=AVSpeech, listen=whisper.cpp, injects DialReasoner) — this is the exact
  # "re-add WITH a real import when on-device Whisper STT ships (needs PrivacyInfo)" trigger the PocketVoice-cut note
  # called out below. Whisper reads the mic → PrivacyInfo.xcprivacy added (NSMicrophone reason API) + the mic-usage
  # string already present. SEQUENCING: this wiring lands WITH/AFTER PR #81 (the package it depends on).
  PocketDialVoice:
    path: ../../packages/PocketDialVoice
  # PocketVoice DECLARED (not linked by the app target) so the TEST target can import WhisperModelDescriptor for the
  # locator drift-catcher (forge/warden #114 nit). The app target's `dependencies:` do NOT list it — the app links
  # PocketVoice only transitively via PocketDialVoice; this declaration just makes the SentiPocketAppTests dep valid.
  PocketVoice:
    path: ../../packages/PocketVoice
  # PocketBriefing CUT from the app target 2026-07-20 (Atlas, per Warden #252313): the rich briefing is SERVER-SIDE
  # now (Relay's gateway reasons via a cloud LLM), so BriefingBuilder is off the Release critical path. Package stays
  # on disk — it's the home for Echo's LATER on-device offline briefing (Gemma). Cut-from-target, NOT deleted.
  # PocketVoice CUT from the app target 2026-07-20 (Atlas, per Pulse #251864): app STT is Apple on-device Speech
  # (OnDeviceSpeechRecognizer), NOT PocketVoice/whisper.cpp — zero `import PocketVoice` in the app closure. The
  # package stays on disk; re-add WITH a real import when on-device Whisper STT actually ships (needs PrivacyInfo).
  # Relay's PocketSyncClient/PocketActionsClient are Phase-B (real gateway); not wired for the Phase-A fixture build.
targets:
  SentiPocketApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: PocketContracts
      - package: PocketCall
      - package: PocketUI
      - package: PocketReasoning
      - package: PocketDialVoice
      - package: PocketVoice
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Senti Pocket
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Required or iOS SIGABRTs on the first permission request (on-device Speech STT + mic barge-in/PTT).
        NSMicrophoneUsageDescription: "Senti Pocket uses the microphone so you can barge in and answer the briefing by voice."
        NSSpeechRecognitionUsageDescription: "Senti Pocket transcribes your speech on-device so you can interrupt a briefing and dictate a proposed action."
        # B2 item 5 (Atlas/Forge #261850): the live-demo gateway URL — CONFIG, not hard-baked. It's an ephemeral
        # cloudflared quick-tunnel that churns on restart; forge re-publishes + updates this value with NO code change.
        SENTI_GATEWAY_URL: "https://feof-sega-prominent-exclude.trycloudflare.com"
        # Pocket-TTS demo bearer (app-seam): read at RUNTIME by DialHost.gatewayBearerProvider() and handed to the WAV
        # synth. REPRODUCIBLE, NO-LITERAL injection (Pulse #5): this Info.plist value is the build-setting REFERENCE
        # `$(SENTI_GATEWAY_BEARER)`, whose default (settings.base below) is EMPTY. The real short-lived value is injected
        # at BUILD time via env / CI, WITHOUT touching tracked source — the ONLY supported route:
        #     xcodebuild ... SENTI_GATEWAY_BEARER="$SENTI_GATEWAY_BEARER"       # overrides the empty default
        # Proof (round-6): a DEFAULT build processes this key to <string></string>; the SAME build with the override
        # processes it to the injected value. NOTE the PROCESSED Info.plist is bundle-readable, so this is only a
        # NARROW, short-lived DEMO capability — never a real/production secret; rotation/revocation is at the gateway.
        # Empty/absent → the provider returns "" UNCHANGED and the synth's validatedBearer rejects it → Siri (safe).
        SENTI_GATEWAY_BEARER: "$(SENTI_GATEWAY_BEARER)"
        # FOREGROUND demo-dial trigger gate (spec A, P0-3). Default OFF: when disabled there is NO demo ring button and
        # no way to self-ring — the reachability path is inert. A dedicated demo build/config flips this to true to expose
        # the trigger. Ring/audio/READ-ONLY even when on: without a real SessionTokenStore token it is NOT authenticated
        # LEAN /dial hydration and NOT governed writeback.
        # BUILD-PARAMETERIZED (mirrors SENTI_GATEWAY_BEARER above): this value is the build-setting reference
        # $(POCKET_DEMO_DIAL_ENABLED); its committed DEFAULT is "NO" (OFF) in settings.base below. A demo build flips
        # it ON only at BUILD time via `xcodebuild ... POCKET_DEMO_DIAL_ENABLED=YES`; it is never edited ON in source.
        POCKET_DEMO_DIAL_ENABLED: "$(POCKET_DEMO_DIAL_ENABLED)"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: false
        SWIFT_VERSION: "5.9"
        # No-literal bearer injection (Pulse #5): the Info.plist key SENTI_GATEWAY_BEARER references THIS user-defined
        # build setting via $(SENTI_GATEWAY_BEARER). Default EMPTY (→ Siri, safe). Override ONLY at build time via env/CI
        # (`xcodebuild SENTI_GATEWAY_BEARER=<token>`) — the real short-lived value NEVER lives in tracked source.
        # Grep-provable: no bearer literal is committed anywhere.
        SENTI_GATEWAY_BEARER: ""
        # Build-time demo gate (spec A), companion to the bearer above. Committed DEFAULT "NO" so the committed/
        # shipped build has the demo dial OFF (DialHost.truthy("NO")=false). Override ONLY at build time
        # (xcodebuild POCKET_DEMO_DIAL_ENABLED=YES) to expose the demo trigger; never flipped in tracked source.
        POCKET_DEMO_DIAL_ENABLED: "NO"
  # XCUITest device/sim target (Atlas-owned per Pulse #249472) — enables the DeviceUITests to run at all.
  # The app-under-test is wired via the `target: SentiPocketApp` dependency (XcodeGen sets the target application).
  # Forge runs a NAMED single test until Atlas maps the -PocketUITestScenario reducer for the other 14.
  SentiPocketAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ../../packages/PocketUI/DeviceUITests
    dependencies:
      - target: SentiPocketApp
      - package: PocketUI
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: "5.9"
  # App-target UNIT tests (Atlas) — the first host-app unit-test target. The app sources (DialHydration, the receive
  # decoder, etc.) are `internal`, so tests reach them via `@testable import SentiPocketApp`; the `target: SentiPocketApp`
  # dependency makes XcodeGen wire this as a HOSTED unit test (TEST_HOST = the app). This is the home for all future
  # app-target unit tests — the ~1800 lines under Sources/ that had no unit-test target until now.
  SentiPocketAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: SentiPocketApp
      - package: PocketContracts
      - package: PocketUI
      # PocketCall: DialCoordinatorTests imports it + references PocketCall.DialOutcome. Was missing → the test target
      # failed to LINK (undefined symbol, caught on the MacinCloud build — no build-CI had caught this pre-existing gap).
      - package: PocketCall
      # PocketVoice: TEST-ONLY. WhisperModelLocatorTests asserts the locator's pinned byteCount/fileName ==
      # WhisperModelDescriptor.baseEnglish (drift-catcher, forge/warden #114 nit). The APP target still links PocketVoice
      # only transitively (via PocketDialVoice) — only this test target imports it, to keep the literal mirror honest.
      - package: PocketVoice
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: "5.9"
schemes:
  SentiPocketApp:
    build:
      targets:
        SentiPocketApp: all
        SentiPocketAppUITests: [test]
        SentiPocketAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SentiPocketAppTests
        - SentiPocketAppUITests
