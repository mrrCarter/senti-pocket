# XcodeGen manifest — Atlas owns this + the generated project. Reproducible from these Windows-authored
# sources: on a Mac run `xcodegen generate` (brew install xcodegen) then open SentiPocketApp.xcodeproj.
# Keeps the Xcode project OUT of git-conflict territory (only this yaml + Swift sources are tracked).
name: SentiPocketApp
options:
  bundleIdPrefix: com.plexaura.sentipocket
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  PocketContracts:
    path: ../../packages/PocketContracts
  PocketCall:
    path: ../../packages/PocketCall
  PocketUI:
    path: ../../packages/PocketUI
  PocketReasoning:
    path: ../../packages/PocketReasoning
  # Read-only authenticated session transport + cursor-safe repositories. Release uses this live Sessions/Activity
  # substrate and must never substitute fixture identifiers for the selected authenticated row.
  PocketSyncClient:
    path: ../../packages/PocketSyncClient
  # PocketDialVoice RE-ADDED to the app target 2026-07-25 (Atlas, per Forge #319232/PR #81): on-device Whisper STT
  # ACTUALLY SHIPS now (LiveDialVoice: speak=AVSpeech, listen=whisper.cpp, injects DialReasoner) — this is the exact
  # "re-add WITH a real import when on-device Whisper STT ships" trigger. Microphone access is disclosed by the
  # NSMicrophoneUsageDescription string; PrivacyInfo.xcprivacy separately declares required-reason API use.
  PocketDialVoice:
    path: ../../packages/PocketDialVoice
  # PocketVoice DECLARED (not linked by the app target) so the TEST target can import WhisperModelDescriptor for the
  # locator drift-catcher (forge/warden #114 nit). The app target's `dependencies:` do NOT list it — the app links
  # PocketVoice only transitively via PocketDialVoice; this declaration just makes the SentiPocketAppTests dep valid.
  PocketVoice:
    path: ../../packages/PocketVoice
  # PocketBriefing CUT from the app target 2026-07-20 (Atlas, per Warden #252313): the rich briefing is SERVER-SIDE
  # now (Relay's gateway reasons via a cloud LLM), so BriefingBuilder is off the Release critical path. Package stays
  # on disk — it's the home for Echo's LATER on-device offline briefing (Gemma). Cut-from-target, NOT deleted.
  # PocketVoice is intentionally not a direct app dependency. LiveDialVoice enters through PocketDialVoice, which
  # owns the on-device Whisper integration; the test target links PocketVoice directly only for descriptor parity.
  # Governed session mutations remain a later lane; PocketSyncClient is intentionally read-only.
targets:
  SentiPocketApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: PocketContracts
      - package: PocketCall
      - package: PocketUI
      - package: PocketReasoning
      - package: PocketSyncClient
      - package: PocketDialVoice
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Senti Pocket
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # CallKit audio remains active while a live Senti call is backgrounded; PushKit must wake the app for a
        # genuine incoming VoIP call. These modes correspond to the app's existing AVAudioSession + PKPushRegistry.
        UIBackgroundModes:
          - audio
          - voip
        # Required or iOS SIGABRTs on the first permission request (on-device Speech STT + mic barge-in/PTT).
        NSMicrophoneUsageDescription: "Senti Pocket uses the microphone so you can barge in and answer the briefing by voice."
        NSSpeechRecognitionUsageDescription: "Senti Pocket transcribes your speech on-device so you can interrupt a briefing and dictate a proposed action."
        # Build trust inputs. They are intentionally undefined by default: Release fails closed until CI or an
        # xcodebuild command-line setting supplies an explicit HTTPS origin. If expansion ever leaves the literal
        # placeholder intact, GatewayEndpoint rejects it too.
        SENTI_API_URL: "$(SENTI_API_URL)"
        SENTI_GATEWAY_URL: "$(SENTI_GATEWAY_URL)"
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Sources/SentiPocketApp.entitlements
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: false
        MARKETING_VERSION: "0.1.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.plexaura.sentipocket.app
        SWIFT_VERSION: "5.9"
        VERSIONING_SYSTEM: apple-generic
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
          # The signed canonical bundle is a DEBUG/preview fixture, never a Release app resource.
          EXCLUDED_SOURCE_FILE_NAMES: canonical_checkpoint.json
  # XCUITest device/sim target (Atlas-owned per Pulse #249472) — enables the DeviceUITests to run at all.
  # The app-under-test is wired via the `target: SentiPocketApp` dependency (XcodeGen sets the target application).
  # Forge runs a NAMED single test until Atlas maps the -PocketUITestScenario reducer for the other 14.
  SentiPocketAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ../../packages/PocketUI/DeviceUITests
    dependencies:
      - target: SentiPocketApp
      - package: PocketUI
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: "5.9"
  # App-target UNIT tests (Atlas) — the first host-app unit-test target. The app sources (DialHydration, the receive
  # decoder, etc.) are `internal`, so tests reach them via `@testable import SentiPocketApp`; the `target: SentiPocketApp`
  # dependency makes XcodeGen wire this as a HOSTED unit test (TEST_HOST = the app). This is the home for all future
  # app-target unit tests — the ~1800 lines under Sources/ that had no unit-test target until now.
  SentiPocketAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: SentiPocketApp
      - package: PocketContracts
      - package: PocketUI
      - package: PocketSyncClient
      - package: PocketReasoning
      # PocketCall: DialCoordinatorTests imports it + references PocketCall.DialOutcome. Was missing → the test target
      # failed to LINK (undefined symbol, caught on the MacinCloud build — no build-CI had caught this pre-existing gap).
      - package: PocketCall
      # PocketVoice: TEST-ONLY. WhisperModelLocatorTests asserts the locator's pinned byteCount/fileName ==
      # WhisperModelDescriptor.baseEnglish (drift-catcher, forge/warden #114 nit). The APP target still links PocketVoice
      # only transitively (via PocketDialVoice) — only this test target imports it, to keep the literal mirror honest.
      - package: PocketVoice
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: "5.9"
schemes:
  SentiPocketApp:
    build:
      targets:
        SentiPocketApp: all
        SentiPocketAppUITests: [test]
        SentiPocketAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SentiPocketAppTests
        - SentiPocketAppUITests
