name: iOS Verify

on:
  workflow_dispatch:
  push:
    paths:
      - ".gitattributes"
      - ".github/workflows/ios-verify.yml"
      - "apps/SentiPocketApp/**"
      - "packages/PocketCall/**"
      - "packages/PocketContracts/**"
      - "packages/PocketDialVoice/**"
      - "packages/PocketReasoning/**"
      - "packages/PocketSyncClient/**"
      - "packages/PocketUI/**"
      - "packages/PocketVoice/**"
      - "scripts/ios/**"
  pull_request:
    paths:
      - ".gitattributes"
      - ".github/workflows/ios-verify.yml"
      - "apps/SentiPocketApp/**"
      - "packages/PocketCall/**"
      - "packages/PocketContracts/**"
      - "packages/PocketDialVoice/**"
      - "packages/PocketReasoning/**"
      - "packages/PocketSyncClient/**"
      - "packages/PocketUI/**"
      - "packages/PocketVoice/**"
      - "scripts/ios/**"

permissions:
  contents: read

concurrency:
  group: ios-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-packages:
    name: ${{ matrix.name }} tests
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: PocketContracts
            path: packages/PocketContracts
          - name: PocketCall
            path: packages/PocketCall
          - name: PocketReasoning
            path: packages/PocketReasoning
          - name: PocketUI
            path: packages/PocketUI
          - name: PocketVoice
            path: packages/PocketVoice
          - name: PocketDialVoice
            path: packages/PocketDialVoice
          - name: PocketSyncClient
            path: packages/PocketSyncClient
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - name: Build and test package
        run: swift test --package-path "${{ matrix.path }}"

  hosted-app-tests:
    name: Hosted app build and tests
    # App Store Connect requires Xcode 26+ with the iOS 26+ SDK for uploads.
    runs-on: macos-26
    timeout-minutes: 60
    env:
      IOS_BUNDLE_ID: "com.plexaura.sentipocket.app"
      IOS_MARKETING_VERSION: "0.1.0"
      IOS_BUILD_NUMBER: "4242"
      IOS_API_URL: "https://api.ci.invalid"
      IOS_GATEWAY_URL: "https://gateway.ci.invalid"
    steps:
      - uses: actions/checkout@v4
      - name: Validate App Store submission toolchain
        shell: bash
        run: |
          set -euo pipefail

          xcode_output="$(xcodebuild -version)"
          developer_dir_input="$(xcode-select -p)"
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          sdk_path_input="$(xcrun --sdk iphoneos --show-sdk-path)"
          developer_dir="$(cd "$developer_dir_input" && pwd -P)"
          sdk_path="$(cd "$sdk_path_input" && pwd -P)"

          printf '%s\n' "$xcode_output"
          printf 'Selected developer directory: %s\n' "$developer_dir"
          printf 'iPhoneOS SDK version: %s\n' "$sdk_version"
          printf 'iPhoneOS SDK path: %s\n' "$sdk_path"

          xcode_version="$(awk '$1 == "Xcode" { print $2; exit }' <<<"$xcode_output")"
          if [[ ! "$xcode_version" =~ ^([0-9]+)(\.[0-9]+)*$ ]]; then
            echo "Could not parse the selected Xcode version: $xcode_version" >&2
            exit 1
          fi
          xcode_major="${BASH_REMATCH[1]}"

          if [[ ! "$sdk_version" =~ ^([0-9]+)(\.[0-9]+)*$ ]]; then
            echo "Could not parse the selected iPhoneOS SDK version: $sdk_version" >&2
            exit 1
          fi
          sdk_major="${BASH_REMATCH[1]}"

          if (( 10#$xcode_major < 26 || 10#$sdk_major < 26 )); then
            echo "App Store submission proof requires Xcode 26+ and iPhoneOS SDK 26+" >&2
            exit 1
          fi

          case "$sdk_path" in
            "$developer_dir"/*) ;;
            *)
              echo "iPhoneOS SDK is not owned by the selected Xcode developer directory" >&2
              exit 1
              ;;
          esac
      - name: Validate iOS release tooling
        shell: bash
        run: |
          test -x scripts/ios/archive_ipa.sh
          bash -n scripts/ios/archive_ipa.sh
          bash scripts/ios/tests/archive_ipa_validation_test.sh
          /usr/bin/plutil -lint apps/SentiPocketApp/ExportOptions.example.plist
          /usr/bin/plutil -lint apps/SentiPocketApp/Sources/SentiPocketApp.entitlements
          /usr/bin/plutil -lint apps/SentiPocketApp/Resources/PrivacyInfo.xcprivacy
          for script in scripts/ios/archive_ipa.sh scripts/ios/tests/archive_ipa_validation_test.sh; do
            test "$(git check-attr eol -- "$script")" = "$script: eol: lf"
            if LC_ALL=C grep -n $'\r' "$script"; then
              echo "$script contains CR bytes" >&2
              exit 1
            fi
          done
      - name: Run unsigned verifier synthetic tests
        run: python3 scripts/ios/tests/verify_unsigned_release_test.py
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: apps/SentiPocketApp
        run: xcodegen generate
      - name: Validate generated Info.plist
        run: /usr/bin/plutil -lint apps/SentiPocketApp/Sources/Info.plist
      - name: Resolve local packages
        run: >-
          xcodebuild
          -project apps/SentiPocketApp/SentiPocketApp.xcodeproj
          -scheme SentiPocketApp
          -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages"
          -resolvePackageDependencies
      - name: Capture and verify unsigned device build settings
        shell: bash
        run: |
          set -u

          capture_and_verify_settings() {
            configuration="$1"
            aps_environment="$2"
            derived_data="$3"
            settings_json="$4"

            xcodebuild -quiet \
              -project apps/SentiPocketApp/SentiPocketApp.xcodeproj \
              -scheme SentiPocketApp \
              -configuration "$configuration" \
              -destination 'generic/platform=iOS' \
              -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
              -derivedDataPath "$derived_data" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              DEVELOPMENT_TEAM= \
              ONLY_ACTIVE_ARCH=NO \
              "PRODUCT_BUNDLE_IDENTIFIER=$IOS_BUNDLE_ID" \
              "MARKETING_VERSION=$IOS_MARKETING_VERSION" \
              "CURRENT_PROJECT_VERSION=$IOS_BUILD_NUMBER" \
              "SENTI_API_URL=$IOS_API_URL" \
              "SENTI_GATEWAY_URL=$IOS_GATEWAY_URL" \
              -showBuildSettings -json >"$settings_json"

            python3 scripts/ios/verify_unsigned_release.py settings \
              --settings-json "$settings_json" \
              --project-file apps/SentiPocketApp/SentiPocketApp.xcodeproj/project.pbxproj \
              --configuration "$configuration" \
              --aps-environment "$aps_environment" \
              --bundle-id "$IOS_BUNDLE_ID" \
              --marketing-version "$IOS_MARKETING_VERSION" \
              --build-number "$IOS_BUILD_NUMBER" \
              --api-url "$IOS_API_URL" \
              --gateway-url "$IOS_GATEWAY_URL" \
              --products-root "$derived_data/Build/Products"
          }

          capture_and_verify_settings Debug development \
            "$RUNNER_TEMP/DebugDeviceDerivedData" \
            "$RUNNER_TEMP/SentiPocketApp-Debug-settings.json"
          capture_and_verify_settings Release production \
            "$RUNNER_TEMP/ReleaseDeviceDerivedData" \
            "$RUNNER_TEMP/SentiPocketApp-Release-settings.json"
      - name: Build unsigned Release device closure
        shell: bash
        run: >-
          xcodebuild
          -project apps/SentiPocketApp/SentiPocketApp.xcodeproj
          -scheme SentiPocketApp
          -configuration Release
          -destination 'generic/platform=iOS'
          -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages"
          -derivedDataPath "$RUNNER_TEMP/ReleaseDeviceDerivedData"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          DEVELOPMENT_TEAM=
          ONLY_ACTIVE_ARCH=NO
          "PRODUCT_BUNDLE_IDENTIFIER=$IOS_BUNDLE_ID"
          "MARKETING_VERSION=$IOS_MARKETING_VERSION"
          "CURRENT_PROJECT_VERSION=$IOS_BUILD_NUMBER"
          "SENTI_API_URL=$IOS_API_URL"
          "SENTI_GATEWAY_URL=$IOS_GATEWAY_URL"
          build
      - name: Verify unsigned Release bundle
        shell: bash
        run: |
          python3 scripts/ios/verify_unsigned_release.py bundle \
            --settings-json "$RUNNER_TEMP/SentiPocketApp-Release-settings.json" \
            --project-file apps/SentiPocketApp/SentiPocketApp.xcodeproj/project.pbxproj \
            --source-privacy apps/SentiPocketApp/Resources/PrivacyInfo.xcprivacy \
            --configuration Release \
            --aps-environment production \
            --bundle-id "$IOS_BUNDLE_ID" \
            --marketing-version "$IOS_MARKETING_VERSION" \
            --build-number "$IOS_BUILD_NUMBER" \
            --api-url "$IOS_API_URL" \
            --gateway-url "$IOS_GATEWAY_URL" \
            --products-root "$RUNNER_TEMP/ReleaseDeviceDerivedData/Build/Products"
      - name: Build simulator closure
        run: >-
          xcodebuild
          -project apps/SentiPocketApp/SentiPocketApp.xcodeproj
          -scheme SentiPocketApp
          -destination 'generic/platform=iOS Simulator'
          -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages"
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Select available iPhone simulator
        id: simulator
        shell: bash
        run: |
          device_id="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          payload = json.load(sys.stdin)
          for devices in payload.get("devices", {}).values():
              for device in devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("no available iPhone simulator")
          ')"
          echo "device_id=$device_id" >> "$GITHUB_OUTPUT"
      - name: Run hosted unit tests
        run: >-
          xcodebuild
          -project apps/SentiPocketApp/SentiPocketApp.xcodeproj
          -scheme SentiPocketApp
          -destination 'id=${{ steps.simulator.outputs.device_id }}'
          -only-testing:SentiPocketAppTests
          -skip-testing:SentiPocketAppUITests
          -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages"
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          -resultBundlePath "$RUNNER_TEMP/SentiPocketAppTests.xcresult"
          CODE_SIGNING_ALLOWED=NO
          test
      - name: Upload XCTest result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SentiPocketAppTests-xcresult
          path: ${{ runner.temp }}/SentiPocketAppTests.xcresult
          if-no-files-found: ignore
