name: Pocket Gateway Deployment CI

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# Read-only verification: this workflow does not sign, upload, or deploy production artifacts and receives no AWS OIDC token.
permissions:
  contents: read

jobs:
  gateway-deployment:
    name: Gateway Deployment Verification
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node 22.23.2
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: |
            services/pocket-gateway/deploy/gateway/package-lock.json
            services/pocket-gateway/deploy/operation-admission/package-lock.json

      - name: Install and audit locked gateway dependencies
        working-directory: services/pocket-gateway/deploy/gateway
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm audit --audit-level=low

      - name: Install and audit locked admission dependencies
        working-directory: services/pocket-gateway/deploy/operation-admission
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm audit --audit-level=low

      - name: Run the complete gateway suite
        working-directory: services/pocket-gateway
        shell: bash
        run: |
          set -euo pipefail
          node --test

      - name: Prove Registry cutover tooling is hermetic and fail-closed
        working-directory: services/pocket-gateway/deploy/gateway
        shell: bash
        run: |
          set -euo pipefail
          npm run registry:test
          npm run registry:plan -- --help

      - name: Prove the Node 22 gateway unsigned source ZIP is reproducible
        working-directory: services/pocket-gateway/deploy/gateway
        shell: bash
        run: |
          set -euo pipefail
          npm run package
          test "$(unzip -Z1 dist/gateway.zip)" = "index.mjs"
          node --input-type=module -e "const artifact = await import('./dist/index.mjs'); if (typeof artifact.handler !== 'function') throw new Error('gateway artifact does not export handler');"
          sha256sum dist/index.mjs dist/gateway.zip | tee "${RUNNER_TEMP}/gateway-unsigned-source.sha256"
          npm run package
          sha256sum --check "${RUNNER_TEMP}/gateway-unsigned-source.sha256"

      - name: Prove the Node 22 unsigned source ZIP is reproducible
        working-directory: services/pocket-gateway/deploy/operation-admission
        shell: bash
        run: |
          set -euo pipefail
          npm run package
          test "$(unzip -Z1 dist/operation-admission.zip)" = "index.mjs"
          node --input-type=module -e "const artifact = await import('./dist/index.mjs'); if (typeof artifact.handler !== 'function') throw new Error('operation-admission artifact does not export handler');"
          sha256sum dist/index.mjs dist/operation-admission.zip | tee "${RUNNER_TEMP}/operation-admission-unsigned-source.sha256"
          npm run package
          sha256sum --check "${RUNNER_TEMP}/operation-admission-unsigned-source.sha256"

      - name: Set up Terraform 1.9.8
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Validate the private dark gateway Terraform topology
        working-directory: services/pocket-gateway/infra/terraform/gateway
        shell: bash
        run: |
          set -euo pipefail
          terraform fmt -check -diff -recursive
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate -no-color
          terraform test -no-color

      - name: Validate the operation-admission Terraform topology
        working-directory: services/pocket-gateway/infra/terraform/operation-admission
        shell: bash
        run: |
          set -euo pipefail
          terraform fmt -check -diff -recursive
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate -no-color
          terraform test -no-color
