name: Omar Gate

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:
    inputs:
      scan_mode:
        description: Sentinelayer scan profile
        required: false
        default: deep
        type: choice
        options:
          - deep
          - nightly
      severity_gate:
        description: Severity threshold that blocks merge
        required: false
        default: P1
        type: choice
        options:
          - P0
          - P1
          - P2
          - none
      p2_max_allowed:
        description: Maximum allowed P2 findings before Omar Gate blocks merge
        required: false
        default: "5"
        type: string

permissions:
  contents: read
  checks: write
  pull-requests: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  omar_gate:
    name: Omar Gate
    runs-on: ubuntu-latest
    environment: security-review
    permissions:
      contents: read
      checks: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: Validate Sentinelayer token secret
        shell: bash
        env:
          SENTINELAYER_TOKEN: ${{ secrets.SENTINELAYER_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${SENTINELAYER_TOKEN}" || (echo "Missing SENTINELAYER_TOKEN" && exit 1)
      - name: Validate Omar managed-LLM contract
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/validate_omar_managed_llm_contract.py --self-test
          python3 .github/scripts/validate_omar_managed_llm_contract.py --workflow .github/workflows/omar-gate.yml
      - name: Run Omar Gate
        id: omar
        uses: mrrCarter/sentinelayer-v1-action@4cb3063e04e3b899981b25f6918b26f70d35a8d4
        with:
          github_token: ${{ github.token }}
          sentinelayer_token: ${{ secrets.SENTINELAYER_TOKEN }}
          sentinelayer_spec_id: ${{ vars.SENTINELAYER_SPEC_ID || '' }}
          sentinelayer_managed_llm: "true"
          scan_mode: ${{ github.event_name == 'workflow_dispatch' && inputs.scan_mode || 'deep' }}
          severity_gate: ${{ github.event_name == 'workflow_dispatch' && inputs.severity_gate || 'P1' }}
          model: gpt-5.3-codex
          codex_model: gpt-5.3-codex
          model_fallback: gpt-4.1-mini
          use_codex: "true"
          codex_only: "false"
          llm_failure_policy: block
          pr_number: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || '' }}
          local_gates_output_dir: .sentinelayer/artifacts/local-gates
      - name: Assert Omar LLM model contract is active
        shell: bash
        env:
          LLM_MODEL: ${{ steps.omar.outputs.model || '' }}
          CODEX_MODEL: ${{ steps.omar.outputs.codex_model || '' }}
          GATE_STATUS: ${{ steps.omar.outputs.gate_status || '' }}
          REQUESTED_MANAGED_LLM: "true"
          REQUESTED_FAILURE_POLICY: block
        run: |
          set -euo pipefail
          model="$(echo "${LLM_MODEL}" | tr -d '\r' | xargs || true)"
          codex_model="$(echo "${CODEX_MODEL}" | tr -d '\r' | xargs || true)"
          model_lc="$(echo "${model}" | tr '[:upper:]' '[:lower:]')"
          codex_model_lc="$(echo "${codex_model}" | tr '[:upper:]' '[:lower:]')"
          gate_status="$(echo "${GATE_STATUS}" | tr -d '\r' | xargs || true)"
          if [ -z "${model}" ] || [ -z "${codex_model}" ]; then
            echo "::error::Omar LLM model outputs missing (model='${model}' codex_model='${codex_model}' gate='${gate_status}'). Blocking merge."
            exit 1
          fi
          if [ "${REQUESTED_MANAGED_LLM}" != "true" ] || [ "${REQUESTED_FAILURE_POLICY}" != "block" ]; then
            echo "::error::Omar LLM policy drifted (managed='${REQUESTED_MANAGED_LLM}' failure='${REQUESTED_FAILURE_POLICY}'). Blocking merge."
            exit 1
          fi
          case "${model_lc}" in
            disabled|none|null|n/a)
              echo "::error::Omar LLM model is disabled/invalid ('${model}'). Blocking merge."
              exit 1
              ;;
          esac
          case "${codex_model_lc}" in
            disabled|none|null|n/a)
              echo "::error::Omar Codex model is disabled/invalid ('${codex_model}'). Blocking merge."
              exit 1
              ;;
          esac
          if [ "${model}" != "gpt-5.3-codex" ] || [ "${codex_model}" != "gpt-5.3-codex" ]; then
            echo "::error::Omar LLM model contract drifted (model='${model}' codex_model='${codex_model}'). Blocking merge."
            exit 1
          fi
          echo "Omar LLM model contract active: model='${model}' codex_model='${codex_model}' gate='${gate_status}'"
      - name: Render Omar compatibility evidence
        id: omar_evidence
        if: always()
        shell: bash
        env:
          OMAR_RUN_ID: ${{ steps.omar.outputs.run_id || 'missing' }}
          OMAR_GATE_STATUS: ${{ steps.omar.outputs.gate_status || 'missing' }}
          OMAR_P0: ${{ steps.omar.outputs.p0_count || '0' }}
          OMAR_P1: ${{ steps.omar.outputs.p1_count || '0' }}
          OMAR_P2: ${{ steps.omar.outputs.p2_count || '0' }}
          OMAR_P3: ${{ steps.omar.outputs.p3_count || '0' }}
          OMAR_SCAN_MODE: ${{ steps.omar.outputs.scan_mode || 'deep' }}
          OMAR_SEVERITY_GATE: ${{ steps.omar.outputs.severity_gate || 'P1' }}
          LOCAL_GATES_STATUS: ${{ steps.omar.outputs.local_gates_status || 'missing' }}
          LOCAL_FINDINGS_PATH: ${{ steps.omar.outputs.local_gates_findings_path || '' }}
          PR_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p .sentinelayer/artifacts/omar-gate
          python3 - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path

          artifact_dir = Path(".sentinelayer/artifacts/omar-gate")
          artifact_dir.mkdir(parents=True, exist_ok=True)

          def env(name: str, default: str = "") -> str:
              return os.environ.get(name, default).strip() or default

          counts = {
              "P0": int(env("OMAR_P0", "0") or 0),
              "P1": int(env("OMAR_P1", "0") or 0),
              "P2": int(env("OMAR_P2", "0") or 0),
              "P3": int(env("OMAR_P3", "0") or 0),
          }
          metadata = {
              "schema_version": 1,
              "generated_at": datetime.datetime.now(datetime.UTC).isoformat(),
              "repository": env("GITHUB_REPOSITORY"),
              "run_id": env("GITHUB_RUN_ID"),
              "run_attempt": env("GITHUB_RUN_ATTEMPT"),
              "head_sha": env("PR_HEAD_SHA", env("GITHUB_SHA")),
              "event_name": env("GITHUB_EVENT_NAME"),
              "omar_run_id": env("OMAR_RUN_ID", "missing"),
              "gate_status": env("OMAR_GATE_STATUS", "missing"),
              "scan_mode": env("OMAR_SCAN_MODE", "deep"),
              "severity_gate": env("OMAR_SEVERITY_GATE", "P1"),
              "counts": counts,
              "local_gates_status": env("LOCAL_GATES_STATUS", "missing"),
          }
          (artifact_dir / "summary.json").write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          findings = []
          findings_raw_path = env("LOCAL_FINDINGS_PATH")
          findings_path = Path(findings_raw_path) if findings_raw_path else None
          if findings_path is not None and findings_path.exists() and findings_path.is_file():
              for line in findings_path.read_text(encoding="utf-8").splitlines():
                  if not line.strip():
                      continue
                  try:
                      findings.append(json.loads(line))
                  except json.JSONDecodeError:
                      continue

          def nested(mapping: dict, *keys: str) -> str:
              current = mapping
              for key in keys:
                  if not isinstance(current, dict):
                      return ""
                  current = current.get(key)
              return str(current or "").strip()

          def pick(mapping: dict, *keys: str) -> str:
              for key in keys:
                  value = str(mapping.get(key) or "").strip()
                  if value:
                      return value
              return ""

          top_findings = []
          for finding in findings:
              severity = pick(finding, "severity", "level", "priority").upper()
              if severity != "P2":
                  continue
              path = (
                  pick(finding, "path", "file", "filename", "artifact")
                  or nested(finding, "location", "path")
                  or nested(finding, "location", "file")
              )
              line = (
                  pick(finding, "line", "line_number", "start_line")
                  or nested(finding, "location", "line")
                  or nested(finding, "location", "start_line")
              )
              if not path:
                  continue
              locator = f"{path}:{line}" if line else path
              title = pick(finding, "title", "message", "description", "rule_id") or "Omar P2 finding"
              top_findings.append(f"{len(top_findings) + 1}. **P2** [`{locator}`] - {title}")

          if not top_findings:
              top_findings.append(
                  "_No P2 findings with file locators were emitted by the workflow-owned evidence path._"
              )

          marker = f"sentinelayer:omar-gate:{metadata['omar_run_id']}:{metadata['run_id']}:{metadata['run_attempt']}"
          comment = "\n".join(
              [
                  f"<!-- {marker} -->",
                  "sentinelayer:omar-gate:",
                  "## Omar Gate",
                  "",
                  f"- run_id: `{metadata['omar_run_id']}`",
                  f"- gate_status: `{metadata['gate_status']}`",
                  f"- findings: `P0={counts['P0']} P1={counts['P1']} P2={counts['P2']} P3={counts['P3']}`",
                  f"- scan_mode: `{metadata['scan_mode']}`",
                  f"- severity_gate: `{metadata['severity_gate']}`",
                  f"- workflow_run: `{metadata['run_id']}` attempt `{metadata['run_attempt']}`",
                  f"- artifact: `omar-gate-workflow-evidence-{metadata['run_id']}-{metadata['run_attempt']}`",
                  "",
                  "### Top Findings",
                  "",
                  *top_findings,
                  "",
                  "### Reviewer Brief",
                  "",
                  "- Compatibility bridge: workflow-owned PR comment generated before scoped-P2 parsing.",
                  "- Notification channel: GitHub PR comment; GitHub subscriber email delivery is delegated to repository notification settings.",
                  "- Evidence artifact includes this comment body, summary JSON, notification delivery JSON, and local gate output.",
                  "",
              ]
          )
          comment_path = artifact_dir / "pr-comment.md"
          comment_path.write_text(comment, encoding="utf-8")
          notification = {
              "schema_version": 1,
              "status": "pending",
              "channels": {
                  "github_pr_comment": {"status": "pending"},
                  "email": {
                      "status": "delegated_to_github_notifications",
                      "reason": "Omar Gate workflow posts a PR comment; GitHub controls subscriber email delivery.",
                  },
              },
          }
          (artifact_dir / "notification-evidence.json").write_text(
              json.dumps(notification, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          output_path = os.environ.get("GITHUB_OUTPUT")
          if output_path:
              with open(output_path, "a", encoding="utf-8") as handle:
                  handle.write(f"comment_path={comment_path}\n")
                  handle.write(f"artifact_dir={artifact_dir}\n")
          PY
      - name: Post Omar compatibility PR comment
        id: omar_comment
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMENT_PATH: ${{ steps.omar_evidence.outputs.comment_path }}
        run: |
          set -euo pipefail
          test -s "${COMMENT_PATH}" || (echo "::error::Missing Omar compatibility PR comment body at ${COMMENT_PATH}" && exit 1)
          body="$(cat "${COMMENT_PATH}")"
          existing_id="$(
            gh api "/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --paginate \
              --jq '[.[] | select((.body // "") | contains("sentinelayer:omar-gate:"))] | last | .id // ""'
          )"
          if [ -n "${existing_id}" ]; then
            comment_id="$(gh api -X PATCH "/repos/${GITHUB_REPOSITORY}/issues/comments/${existing_id}" -f body="${body}" --jq '.id')"
            delivery_status="updated"
          else
            comment_id="$(gh api -X POST "/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="${body}" --jq '.id')"
            delivery_status="created"
          fi
          echo "comment_id=${comment_id}" >> "$GITHUB_OUTPUT"
          echo "delivery_status=${delivery_status}" >> "$GITHUB_OUTPUT"
          export COMMENT_ID="${comment_id}"
          export DELIVERY_STATUS="${delivery_status}"
          python3 - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path

          path = Path(".sentinelayer/artifacts/omar-gate/notification-evidence.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          payload["status"] = "delivered"
          payload["delivered_at"] = datetime.datetime.now(datetime.UTC).isoformat()
          payload["channels"]["github_pr_comment"] = {
              "status": os.environ["DELIVERY_STATUS"],
              "comment_id": os.environ["COMMENT_ID"],
              "pr_number": os.environ["PR_NUMBER"],
          }
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
      - name: Upload Omar workflow evidence artifact
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874
        with:
          name: omar-gate-workflow-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .sentinelayer/artifacts/**
          retention-days: 30
          if-no-files-found: error
          compression-level: 9
          include-hidden-files: true
      - name: Compute PR-scoped P2 count
        id: scoped_p2
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TOTAL_P2: ${{ steps.omar.outputs.p2_count || '0' }}
        run: |
          set -euo pipefail
          # Scope the P2 count to findings whose file appears in the PR diff
          # so unrelated pre-existing noise on other files doesn't block merge.
          # Policy owner: Carter. Reference: #322 verification_token schema PR
          # that triggered this change — P0=0 P1=0 but 7 P2s on files the PR
          # never touched.
          changed="$(gh pr view "${PR_NUMBER}" --json files --jq '.files[].path' || true)"
          if [ -z "${changed}" ]; then
            echo "No PR diff file list resolved; falling back to total P2 count."
            echo "scoped_p2_count=${TOTAL_P2}" >> "$GITHUB_OUTPUT"
            echo "scope=fallback_total" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p /tmp/omar-scope
          printf '%s\n' "${changed}" > /tmp/omar-scope/changed.txt
          # Pull the Omar Gate bot comment (tagged with sentinelayer marker).
          # The comment is the compatibility-bridge evidence path used by the
          # scoped-P2 parser; check/dashboard status alone is not enough.
          comment_body=""
          for attempt in {1..12}; do
            comment_body="$(
              gh api "/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
                --paginate \
                --jq '[.[] | select((.body // "") | contains("sentinelayer:omar-gate:"))] | last | .body // ""'
            )"
            if [ -n "${comment_body}" ]; then
              break
            fi
            echo "Omar Gate PR comment not visible yet; waiting for compatibility bridge evidence (attempt ${attempt}/12)."
            sleep 5
          done
          if [ -z "${comment_body}" ]; then
            echo "::error::Omar Gate PR comment was not posted after 60s; compatibility bridge comment evidence is required for PR-scoped P2 counting. Blocking merge instead of relying only on check/dashboard status."
            exit 1
          fi
          printf '%s' "${comment_body}" > /tmp/omar-scope/comment.md
          scoped="$(python3 .github/scripts/count_scoped_p2.py)"
          scoped="$(echo "${scoped}" | tr -d '\r' | xargs || echo 0)"
          case "${scoped}" in ''|*[!0-9]*) scoped=0 ;; esac
          total_p2="$(echo "${TOTAL_P2}" | tr -d '\r' | xargs || echo 0)"
          case "${total_p2}" in ''|*[!0-9]*) total_p2=0 ;; esac
          scope="pr_diff"
          if [ "${total_p2}" -gt 0 ] && [ "${scoped}" -eq 0 ] && ! grep -q '\*\*P2\*\*' /tmp/omar-scope/comment.md; then
            echo "::warning::Omar PR comment contained no P2 file locators while total P2=${total_p2}; preserving total P2 count."
            scoped="${total_p2}"
            scope="pr_diff_no_p2_locators_total"
          fi
          echo "Total P2 reported by Omar: ${total_p2}. Scoped to PR files: ${scoped}."
          echo "scoped_p2_count=${scoped}" >> "$GITHUB_OUTPUT"
          echo "scope=${scope}" >> "$GITHUB_OUTPUT"
      - name: Enforce Omar reviewer merge thresholds
        shell: bash
        env:
          P0_COUNT: ${{ steps.omar.outputs.p0_count || '0' }}
          P1_COUNT: ${{ steps.omar.outputs.p1_count || '0' }}
          P2_TOTAL: ${{ steps.omar.outputs.p2_count || '0' }}
          # Prefer the PR-scoped count when available (pull_request runs).
          # Pushes / workflow_dispatch fall back to the total count because
          # there's no PR diff to scope against.
          P2_COUNT: ${{ steps.scoped_p2.outputs.scoped_p2_count || steps.omar.outputs.p2_count || '0' }}
          P2_SCOPE: ${{ steps.scoped_p2.outputs.scope || 'total' }}
          P2_MAX_ALLOWED: ${{ github.event_name == 'workflow_dispatch' && inputs.p2_max_allowed || '5' }}
        run: |
          set -euo pipefail
          p0="$(echo "${P0_COUNT}" | tr -d '\r' | xargs || true)"
          p1="$(echo "${P1_COUNT}" | tr -d '\r' | xargs || true)"
          p2="$(echo "${P2_COUNT}" | tr -d '\r' | xargs || true)"
          p2_total="$(echo "${P2_TOTAL}" | tr -d '\r' | xargs || true)"
          p2_max="$(echo "${P2_MAX_ALLOWED}" | tr -d '\r' | xargs || true)"
          case "${p0}" in ''|*[!0-9]*) echo "::error::Invalid Omar P0 count: ${p0}" ; exit 1 ;; esac
          case "${p1}" in ''|*[!0-9]*) echo "::error::Invalid Omar P1 count: ${p1}" ; exit 1 ;; esac
          case "${p2}" in ''|*[!0-9]*) echo "::error::Invalid Omar P2 count: ${p2}" ; exit 1 ;; esac
          case "${p2_max}" in ''|*[!0-9]*) echo "::error::Invalid p2_max_allowed value: ${p2_max}" ; exit 1 ;; esac
          if [ "${p0}" -gt 0 ] || [ "${p1}" -gt 0 ]; then
            echo "::error::Omar Gate blocked: P0=${p0}, P1=${p1}. Threshold requires P0=0 and P1=0."
            exit 1
          fi
          if [ "${p2}" -gt "${p2_max}" ]; then
            echo "::error::Omar Gate blocked: P2=${p2} (scope=${P2_SCOPE}, total=${p2_total}) exceeds max allowed ${p2_max}."
            exit 1
          fi
          echo "Omar Gate merge threshold passed: P0=${p0}, P1=${p1}, P2=${p2} (scope=${P2_SCOPE}, total=${p2_total}) <= ${p2_max}."
      - name: Emit Omar run summary
        shell: bash
        env:
          P2_SCOPE: ${{ steps.scoped_p2.outputs.scope || 'total' }}
          P2_SCOPED_COUNT: ${{ steps.scoped_p2.outputs.scoped_p2_count || steps.omar.outputs.p2_count }}
        run: |
          set -euo pipefail
          echo "## Omar Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "- run_id: \`${{ steps.omar.outputs.run_id }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- gate_status: \`${{ steps.omar.outputs.gate_status }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- findings: \`P0=${{ steps.omar.outputs.p0_count }} P1=${{ steps.omar.outputs.p1_count }} P2=${{ steps.omar.outputs.p2_count }} P3=${{ steps.omar.outputs.p3_count }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- p2_scope: \`${P2_SCOPE}\` (counted=${P2_SCOPED_COUNT})" >> "$GITHUB_STEP_SUMMARY"
          echo "- merge_threshold: \`P0=0, P1=0, P2<=${{ github.event_name == 'workflow_dispatch' && inputs.p2_max_allowed || '5' }}\`" >> "$GITHUB_STEP_SUMMARY"

