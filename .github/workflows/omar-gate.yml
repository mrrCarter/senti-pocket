name: Omar Gate

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      scan_mode:
        description: Sentinelayer scan profile
        required: false
        default: deep
        type: choice
        options:
          - deep
          - nightly
      p2_max_allowed:
        description: Maximum allowed PR-scoped P2 findings before Omar Gate blocks merge
        required: false
        default: "5"
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  omar-precheck:
    name: Omar Gate Precheck
    runs-on: ubuntu-22.04
    outputs:
      allow_scan: ${{ steps.gate.outputs.allow_scan }}
    permissions:
      contents: read
    steps:
      - id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork || false }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "pull_request" ] && [ "${IS_FORK_PR}" = "true" ]; then
            echo "allow_scan=false" >> "${GITHUB_OUTPUT}"
            echo "Skipping privileged Omar scan for forked pull_request events."
            exit 0
          fi

          echo "allow_scan=true" >> "${GITHUB_OUTPUT}"

  omar-review:
    name: Omar Gate (Deep Scan)
    needs: [omar-precheck]
    if: needs.omar-precheck.outputs.allow_scan == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
      checks: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate Omar workflow contract
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/check_omar_workflow_contract.py --self-test
          python3 scripts/ci/check_omar_workflow_contract.py
          python3 scripts/ci/check_forbidden_omar_surface.py --self-test
          python3 scripts/ci/check_forbidden_omar_surface.py

      - name: Validate Omar provider secrets
        shell: bash
        env:
          SENTINELAYER_TOKEN: ${{ secrets.SENTINELAYER_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SENTINELAYER_TOKEN:-}" ]; then
            echo "::error::SENTINELAYER_TOKEN is required for Omar Gate telemetry, artifacts, and PR checks."
            exit 1
          fi
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error::OPENAI_API_KEY is required for repo-owned Omar LLM scans."
            exit 1
          fi

      - name: Omar Gate
        id: omar
        uses: mrrCarter/sentinelayer-v1-action@8afb7dbb42a5e1c25233d422c4cabe401ba02380 # full Omar action + managed capacity fallback
        with:
          github_token: ${{ github.token }}
          llm_provider: openai
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          sentinelayer_token: ${{ secrets.SENTINELAYER_TOKEN }}
          sentinelayer_managed_llm: ${{ secrets.SENTINELAYER_TOKEN != '' }}
          sentinelayer_spec_id: ${{ vars.SENTINELAYER_SPEC_ID || '' }}
          scan_mode: ${{ github.event_name == 'workflow_dispatch' && inputs.scan_mode || 'deep' }}
          severity_gate: P1
          model: gpt-5.3-codex
          codex_model: gpt-5.3-codex
          model_fallback: gpt-5.3-codex
          use_codex: "true"
          codex_only: "false"
          llm_failure_policy: block

      - name: Assert Omar LLM contract is active
        shell: bash
        env:
          REQUESTED_LLM_PROVIDER: openai
          REQUESTED_MODEL: gpt-5.3-codex
          REQUESTED_CODEX_MODEL: gpt-5.3-codex
          REQUESTED_FALLBACK_MODEL: gpt-5.3-codex
          REQUESTED_USE_CODEX: "true"
          REQUESTED_FAILURE_POLICY: block
          GATE_STATUS: ${{ steps.omar.outputs.gate_status || '' }}
        run: |
          set -euo pipefail
          provider="$(echo "${REQUESTED_LLM_PROVIDER}" | tr -d '\r' | xargs || true)"
          model="$(echo "${REQUESTED_MODEL}" | tr -d '\r' | xargs || true)"
          codex_model="$(echo "${REQUESTED_CODEX_MODEL}" | tr -d '\r' | xargs || true)"
          fallback="$(echo "${REQUESTED_FALLBACK_MODEL}" | tr -d '\r' | xargs || true)"
          use_codex="$(echo "${REQUESTED_USE_CODEX}" | tr -d '\r' | xargs || true)"
          failure_policy="$(echo "${REQUESTED_FAILURE_POLICY}" | tr -d '\r' | xargs || true)"
          provider_lc="$(echo "${provider}" | tr '[:upper:]' '[:lower:]')"
          model_lc="$(echo "${model}" | tr '[:upper:]' '[:lower:]')"
          codex_model_lc="$(echo "${codex_model}" | tr '[:upper:]' '[:lower:]')"
          gate_status="$(echo "${GATE_STATUS}" | tr -d '\r' | xargs || true)"
          if [ -z "${provider}" ] || [ -z "${model}" ] || [ -z "${codex_model}" ]; then
            echo "::error::Omar requested model contract is incomplete (provider='${provider}' model='${model}' codex_model='${codex_model}' gate='${gate_status}'). Blocking merge."
            exit 1
          fi
          # Deterministic codex contract (owner override): provider=openai,
          # model/codex_model/model_fallback all pinned to gpt-5.3-codex,
          # use_codex=true, llm_failure_policy=block. Any drift blocks merge.
          if [ "${provider_lc}" != "openai" ] || [ "${model}" != "gpt-5.3-codex" ] || [ "${codex_model}" != "gpt-5.3-codex" ] || [ "${fallback}" != "gpt-5.3-codex" ] || [ "${use_codex}" != "true" ] || [ "${failure_policy}" != "block" ]; then
            echo "::error::Omar deterministic codex contract drifted (provider='${provider}' model='${model}' codex_model='${codex_model}' fallback='${fallback}' use_codex='${use_codex}' failure='${failure_policy}'). Blocking merge."
            exit 1
          fi
          case "${model_lc}" in
            disabled|none|null|n/a)
              echo "::error::Omar LLM model is disabled/invalid ('${model}'). Blocking merge."
              exit 1
              ;;
          esac
          case "${codex_model_lc}" in
            disabled|none|null|n/a)
              echo "::error::Omar Codex model is disabled/invalid ('${codex_model}'). Blocking merge."
              exit 1
              ;;
          esac
          if [ "${gate_status}" != "passed" ]; then
            echo "::error::Omar Gate did not pass (gate='${gate_status}'). Blocking merge."
            exit 1
          fi
          echo "Omar LLM contract active: provider='${provider}' model='${model}' codex_model='${codex_model}' fallback='${fallback}' gate='${gate_status}'"

      - name: Resolve sanitized Omar artifact directory
        id: artifact_path
        if: ${{ always() && steps.omar.outputs.run_id != '' }}
        shell: bash
        env:
          RUN_ID: ${{ steps.omar.outputs.run_id }}
        run: |
          set -euo pipefail
          normalized_run_id="$(echo "${RUN_ID}" | tr -d '\r' | xargs)"
          if ! echo "${normalized_run_id}" | grep -Eq '^[A-Za-z0-9._-]+$'; then
            echo "::warning::Skipping artifact upload: invalid run_id format '${normalized_run_id}'."
            exit 0
          fi
          artifact_dir=".sentinelayer/runs/${normalized_run_id}"
          if [ ! -d "${artifact_dir}" ]; then
            echo "::notice::No run artifact directory found at ${artifact_dir}; skipping upload."
            exit 0
          fi
          echo "artifact_dir=${artifact_dir}" >> "${GITHUB_OUTPUT}"

      - name: Upload Omar Gate artifacts
        if: ${{ always() && steps.artifact_path.outputs.artifact_dir != '' }}
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: omar-gate-${{ github.run_id }}
          path: ${{ steps.artifact_path.outputs.artifact_dir }}
          if-no-files-found: warn

      - name: Compute PR-scoped P2 count
        id: scoped_p2
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TOTAL_P2: ${{ steps.omar.outputs.p2_count || '0' }}
          OMAR_ARTIFACT_DIR: ${{ steps.artifact_path.outputs.artifact_dir || '' }}
        run: |
          set -euo pipefail
          changed="$(gh pr view "${PR_NUMBER}" --json files --jq '.files[].path' || true)"
          if [ -z "${changed}" ]; then
            echo "No PR diff file list resolved; falling back to total P2 count."
            echo "scoped_p2_count=${TOTAL_P2}" >> "$GITHUB_OUTPUT"
            echo "scope=fallback_total" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p /tmp/omar-scope
          printf '%s\n' "${changed}" > /tmp/omar-scope/changed.txt
          if [ -z "${OMAR_ARTIFACT_DIR}" ] || [ ! -f "${OMAR_ARTIFACT_DIR}/FINDINGS.jsonl" ]; then
            echo "::warning::Omar Gate FINDINGS.jsonl not found; scoped P2 count falls back to total."
            echo "scoped_p2_count=${TOTAL_P2}" >> "$GITHUB_OUTPUT"
            echo "scope=fallback_no_findings" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cp "${OMAR_ARTIFACT_DIR}/FINDINGS.jsonl" /tmp/omar-scope/findings.jsonl
          scoped="$(python3 .github/scripts/count_scoped_p2.py)"
          scoped="$(echo "${scoped}" | tr -d '\r' | xargs || echo 0)"
          case "${scoped}" in ''|*[!0-9]*) scoped=0 ;; esac
          echo "Total P2 reported by Omar: ${TOTAL_P2}. Scoped to PR files: ${scoped}."
          echo "scoped_p2_count=${scoped}" >> "$GITHUB_OUTPUT"
          echo "scope=pr_diff" >> "$GITHUB_OUTPUT"

      - name: Enforce Omar reviewer merge thresholds
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          P0_COUNT: ${{ steps.omar.outputs.p0_count || '0' }}
          P1_COUNT: ${{ steps.omar.outputs.p1_count || '0' }}
          P2_TOTAL: ${{ steps.omar.outputs.p2_count || '0' }}
          P2_COUNT: ${{ steps.scoped_p2.outputs.scoped_p2_count || steps.omar.outputs.p2_count || '0' }}
          P2_SCOPE: ${{ steps.scoped_p2.outputs.scope || 'total' }}
          DISPATCH_P2_MAX_ALLOWED: ${{ github.event_name == 'workflow_dispatch' && inputs.p2_max_allowed || '' }}
          # PRs stay strict via PR-scoped P2<=5; push-to-master uses a documented
          # ceiling to avoid self-DOS on any recurring full-repo P2 baseline.
          # Lower OMAR_PUSH_P2_MAX_ALLOWED as that baseline is burned down.
          WEB_PUSH_P2_MAX_ALLOWED: ${{ vars.OMAR_PUSH_P2_MAX_ALLOWED || '40' }}
        run: |
          set -euo pipefail
          p0="$(echo "${P0_COUNT}" | tr -d '\r' | xargs || true)"
          p1="$(echo "${P1_COUNT}" | tr -d '\r' | xargs || true)"
          p2="$(echo "${P2_COUNT}" | tr -d '\r' | xargs || true)"
          p2_total="$(echo "${P2_TOTAL}" | tr -d '\r' | xargs || true)"
          event_name="$(echo "${EVENT_NAME}" | tr -d '\r' | xargs || true)"
          p2_max="5"
          if [ "${event_name}" = "workflow_dispatch" ]; then
            p2_max="$(echo "${DISPATCH_P2_MAX_ALLOWED}" | tr -d '\r' | xargs || true)"
          elif [ "${event_name}" = "push" ]; then
            p2_max="$(echo "${WEB_PUSH_P2_MAX_ALLOWED}" | tr -d '\r' | xargs || true)"
          fi
          case "${p0}" in ''|*[!0-9]*) echo "::error::Invalid Omar P0 count: ${p0}" ; exit 1 ;; esac
          case "${p1}" in ''|*[!0-9]*) echo "::error::Invalid Omar P1 count: ${p1}" ; exit 1 ;; esac
          case "${p2}" in ''|*[!0-9]*) echo "::error::Invalid Omar P2 count: ${p2}" ; exit 1 ;; esac
          case "${p2_total}" in ''|*[!0-9]*) echo "::error::Invalid Omar total P2 count: ${p2_total}" ; exit 1 ;; esac
          case "${p2_max}" in ''|*[!0-9]*) echo "::error::Invalid p2_max_allowed value: ${p2_max}" ; exit 1 ;; esac
          if [ "${p0}" -gt 0 ] || [ "${p1}" -gt 0 ]; then
            echo "::error::Omar Gate blocked: P0=${p0}, P1=${p1}. Threshold requires P0=0 and P1=0."
            exit 1
          fi
          if [ "${p2}" -gt "${p2_max}" ]; then
            echo "::error::Omar Gate blocked: P2=${p2} (scope=${P2_SCOPE}, total=${p2_total}) exceeds max allowed ${p2_max}."
            exit 1
          fi
          echo "OMAR_EFFECTIVE_P2_COUNT=${p2}" >> "$GITHUB_ENV"
          echo "OMAR_EFFECTIVE_P2_TOTAL=${p2_total}" >> "$GITHUB_ENV"
          echo "OMAR_EFFECTIVE_P2_SCOPE=${P2_SCOPE}" >> "$GITHUB_ENV"
          echo "OMAR_EFFECTIVE_P2_MAX_ALLOWED=${p2_max}" >> "$GITHUB_ENV"
          echo "Omar Gate merge threshold passed: P0=${p0}, P1=${p1}, P2=${p2} (scope=${P2_SCOPE}, total=${p2_total}) <= ${p2_max}."

      - name: Emit Omar run summary
        shell: bash
        run: |
          set -euo pipefail
          echo "## Omar Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "- run_id: \`${{ steps.omar.outputs.run_id }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- gate_status: \`${{ steps.omar.outputs.gate_status }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- findings: \`P0=${{ steps.omar.outputs.p0_count }} P1=${{ steps.omar.outputs.p1_count }} P2=${{ steps.omar.outputs.p2_count }} P3=${{ steps.omar.outputs.p3_count }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- merge_threshold: \`P0=0, P1=0, P2<=${OMAR_EFFECTIVE_P2_MAX_ALLOWED}\` (scope=${OMAR_EFFECTIVE_P2_SCOPE}, evaluated=${OMAR_EFFECTIVE_P2_COUNT}, total=${OMAR_EFFECTIVE_P2_TOTAL}, trigger=${{ github.event_name }})" >> "$GITHUB_STEP_SUMMARY"

  omar-fork-static:
    name: Omar Gate Fork Static
    needs: [omar-precheck]
    if: needs.omar-precheck.outputs.allow_scan != 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Run deterministic fork fallback checks
        shell: bash
        run: |
          set -euo pipefail
          tracked_env_files="$(git ls-files | grep -E '(^|/)\.env(\..+)?$' | grep -Ev '^\.env\.example$' || true)"
          if [ -n "${tracked_env_files}" ]; then
            echo "::error::Tracked dotenv files are not allowed in fork PRs:"
            echo "${tracked_env_files}"
            exit 1
          fi
          echo "No tracked dotenv files detected; deterministic fork static checks passed."

      - name: Emit fork static summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Omar Gate Fork Static"
            echo "- mode: \`fork-pr-static-no-secrets\`"
            echo "- checkout: \`pull request head with persist-credentials=false\`"
            echo "- canonical Omar Gate: \`runs on trusted branches with repo-owned OpenAI/Codex secrets plus managed fallback\`"
            echo "- deterministic static checks: \`passed\`"
            echo "- required_context: \`Omar Gate Finalize\`"
          } >> "$GITHUB_STEP_SUMMARY"

  omar-gate-finalize:
    name: Omar Gate Finalize
    if: always()
    needs: [omar-precheck, omar-review, omar-fork-static]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Consolidate Omar gate status
        env:
          ALLOW_SCAN: ${{ needs.omar-precheck.outputs.allow_scan || '' }}
          OMAR_REVIEW_RESULT: ${{ needs.omar-review.result || '' }}
          OMAR_FORK_STATIC_RESULT: ${{ needs.omar-fork-static.result || '' }}
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && 'true' || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${IS_FORK_PR}" = "true" ] || [ "${ALLOW_SCAN}" != "true" ]; then
            if [ "${OMAR_FORK_STATIC_RESULT}" != "success" ]; then
              echo "::error::Omar fork static result is '${OMAR_FORK_STATIC_RESULT}'."
              exit 1
            fi
            echo "::notice::Omar fork PR finalized with deterministic no-secret fallback."
            exit 0
          fi

          if [ "${OMAR_REVIEW_RESULT}" != "success" ]; then
            echo "::error::Omar Gate review result is '${OMAR_REVIEW_RESULT}'."
            exit 1
          fi
          echo "::notice::Canonical Omar Gate finalized successfully."

  telemetry-upload-assertion:
    name: Telemetry Upload Assertion
    if: always() && needs.omar-precheck.outputs.allow_scan == 'true'
    needs: [omar-precheck, omar-review]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Assert no telemetry upload failures in Omar logs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          job_ids="$(gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}/jobs" --paginate --jq '.jobs[] | select(.name == "Omar Gate (Deep Scan)") | .id')"
          if [ -z "${job_ids}" ]; then
            echo "::error::Unable to locate Omar Gate jobs for telemetry assertion."
            exit 1
          fi

          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "${tmp_dir}"' EXIT
          failed=0

          for job_id in ${job_ids}; do
            log_file="${tmp_dir}/${job_id}.log"
            # `gh api` refuses ANSI-bearing log responses but exposes no API
            # opt-in for them. Use the dedicated, authenticated log command;
            # the parser below treats its output as untrusted text.
            gh run view "${RUN_ID}" --repo "${REPOSITORY}" \
              --job "${job_id}" --log > "${log_file}"
            if ! python3 - "${log_file}" "${job_id}" <<'PY'
          import json
          import sys

          log_path, job_id = sys.argv[1], sys.argv[2]
          success = False
          failures = []

          with open(log_path, "r", encoding="utf-8", errors="replace") as handle:
              for line in handle:
                  start = line.find("{")
                  if start == -1:
                      continue
                  try:
                      record = json.loads(line[start:])
                  except json.JSONDecodeError:
                      continue

                  message = str(record.get("message", ""))
                  safe_message = "".join(
                      character if character.isprintable() else "?"
                      for character in message
                  )[:500]
                  stage = str(record.get("stage", ""))
                  status = record.get("status")
                  level = str(record.get("level", "")).lower()
                  message_lc = message.lower()
                  telemetry_record = "telemetry" in message_lc or stage.lower() == "telemetry"
                  if message == "Telemetry uploaded" and str(status) == "200":
                      success = True
                      continue
                  if not telemetry_record:
                      continue
                  status_lc = str(status).lower()
                  if level in {"error", "critical"}:
                      failures.append(safe_message or f"level={level}")
                  if status_lc in {"failed", "failure", "error", "timeout"}:
                      failures.append(safe_message or f"status={status_lc}")
                  if any(word in message_lc for word in ("failed", "failure", "error", "exception", "timeout")):
                      failures.append(safe_message)

          if failures:
              print(f"::error::Telemetry failure signal was detected in Omar job {job_id}: {failures[:3]}")
              sys.exit(1)
          if not success:
              print(f"::error::Telemetry success record was not found in Omar job {job_id}.")
              sys.exit(1)
          PY
            then
              failed=1
            fi
          done

          if [ "${failed}" -ne 0 ]; then
            echo "::error::Telemetry upload failures detected in Omar logs."
            exit 1
          fi

          echo "No telemetry upload failures detected in Omar logs."
